<html>
  <head>
    <title>Rock-paper-scissors
    </title>
  </head>
  
 <link rel="stylesheet" href="rock-paper-scissor.css">
  <body>
    <p class="titleClass">ROCK PAPER SCISSORS</p>
    <button class="moveIcon js-rock-button"><img src="img/rock.png " width="100px" height="100px"></button>

    <button

 <script src="rock-paper-scissor.js"></script>
